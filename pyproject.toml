[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terraria-bench"
version = "0.1.0"
description = "Deterministic, long-horizon agent evaluation and RL environment for Terraria over MCP (StoreBench architecture)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
agents = [
    "mcp>=1.0",
    "google-genai>=3.2",  # 3.2 adds client.decisions (Gemini Decisions API)
    "openai>=1.30",
    "rich>=13.7",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["terraria_bench*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
