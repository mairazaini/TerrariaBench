name: Anti-Cheat Reward Integrity CI (CRACI)

on:
  push:
    branches: [ junction-final-submission, main ]
  pull_request:
    branches: [ junction-final-submission, main ]

jobs:
  verify-anti-cheat:
    name: Verify Reward Integrity & Anti-Cheat Guards
    runs-on: craci
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow

      - name: Run Anti-Cheat Test Suite
        run: |
          pytest tests/test_reward_integrity.py -v

      - name: Entire Session Trail Sync
        run: |
          python tools/entire_sync.py
